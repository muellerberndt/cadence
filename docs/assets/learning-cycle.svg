<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Manrope, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb3c8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fbf9c"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e4572e"/></marker>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132238"/><stop offset="1" stop-color="#0d1726"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="440" rx="18" fill="url(#panel)"/>
  <text x="32" y="40" fill="#e8ecf2" font-size="20" font-weight="700">How it learns: equilibrium, tilt, equilibrium, contrast</text>
  <text x="32" y="62" fill="#9fb3c8" font-size="13">the net rests in a minimum of its energy; a nudge on the outputs tilts the energy both ways; every seam reads where it came to rest each time</text>

  <!-- panel 1: free settlement -->
  <g transform="translate(32,90)">
    <rect x="0" y="0" width="262" height="250" rx="12" fill="#0b1421" stroke="#2c3547"/>
    <text x="16" y="28" fill="#e8ecf2" font-size="14" font-weight="700">1 · Settle free</text>
    <text x="16" y="46" fill="#9fb3c8" font-size="11.5">clamp the inputs, nudge nothing</text>
    <path d="M 20 70 C 60 80, 90 150, 130 160 C 170 168, 210 100, 245 66" fill="none" stroke="#9fb3c8" stroke-width="2.2"/>
    <line x1="130" y1="168" x2="130" y2="205" stroke="#3a475a" stroke-dasharray="3 3"/>
    <circle cx="130" cy="150" r="9" fill="#f4b400" stroke="#1c2430"/>
    <text x="130" y="222" fill="#e8ecf2" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace">s⁰ = rest</text>
    <text x="16" y="242" fill="#9fb3c8" font-size="11.5">the outputs at rest are the answer</text>
    <text x="236" y="86" fill="#3a475a" font-size="11">E</text>
  </g>

  <!-- panel 2: tilt -->
  <g transform="translate(318,90)">
    <rect x="0" y="0" width="262" height="250" rx="12" fill="#0b1421" stroke="#2c3547"/>
    <text x="16" y="28" fill="#e8ecf2" font-size="14" font-weight="700">2 · Tilt, and settle again</text>
    <text x="16" y="46" fill="#9fb3c8" font-size="11.5">add β·(target − p) on the output owners</text>
    <!-- +beta tilted valley (minimum shifts right, lower) -->
    <path d="M 20 60 C 60 76, 100 150, 150 166 C 190 174, 220 130, 245 96" fill="none" stroke="#3fbf9c" stroke-width="2.2"/>
    <!-- -beta tilted valley (minimum shifts left) -->
    <path d="M 20 96 C 45 130, 80 172, 112 166 C 150 158, 200 90, 245 60" fill="none" stroke="#e4572e" stroke-width="2.2" stroke-dasharray="6 4"/>
    <!-- ghost of the free minimum -->
    <circle cx="130" cy="150" r="9" fill="none" stroke="#9fb3c8" stroke-dasharray="3 3"/>
    <circle cx="150" cy="158" r="9" fill="#3fbf9c" stroke="#1c2430"/>
    <circle cx="112" cy="158" r="9" fill="#e4572e" stroke="#1c2430"/>
    <text x="176" y="196" fill="#3fbf9c" font-size="12.5" font-family="JetBrains Mono, Menlo, monospace">s⁺  (+β)</text>
    <text x="30" y="196" fill="#e4572e" font-size="12.5" font-family="JetBrains Mono, Menlo, monospace">s⁻  (−β)</text>
    <text x="16" y="224" fill="#9fb3c8" font-size="11.5">the outputs move; through the feedback</text>
    <text x="16" y="240" fill="#9fb3c8" font-size="11.5">seams the hidden owners move a little too</text>
  </g>

  <!-- panel 3: contrast -->
  <g transform="translate(604,90)">
    <rect x="0" y="0" width="264" height="250" rx="12" fill="#0b1421" stroke="#2c3547"/>
    <text x="16" y="28" fill="#e8ecf2" font-size="14" font-weight="700">3 · Every seam reads itself</text>
    <text x="16" y="46" fill="#9fb3c8" font-size="11.5">two numbers per seam, one per owner</text>
    <line x1="60" y1="110" x2="204" y2="110" stroke="#3fbf9c" stroke-width="3" marker-start="url(#g)" marker-end="url(#g)"/>
    <circle cx="60" cy="110" r="20" fill="#2f4f8a" stroke="#e8ecf2" stroke-width="1.5"/>
    <circle cx="204" cy="110" r="20" fill="#f4b400" stroke="#1c2430" stroke-width="1.5"/>
    <text x="60" y="114" fill="#e8ecf2" font-size="11" text-anchor="middle">i</text>
    <text x="204" y="114" fill="#1c2430" font-size="11" text-anchor="middle" font-weight="700">j</text>
    <g font-family="JetBrains Mono, Menlo, monospace" font-size="11" text-anchor="middle">
      <text x="60" y="146" fill="#3fbf9c">s⁺ at i</text><text x="60" y="162" fill="#e4572e">s⁻ at i</text>
      <text x="204" y="146" fill="#3fbf9c">s⁺ at j</text><text x="204" y="162" fill="#e4572e">s⁻ at j</text>
    </g>
    <rect x="16" y="180" width="232" height="44" rx="8" fill="#132238" stroke="#2c3547"/>
    <text x="132" y="207" fill="#e8ecf2" font-size="12.5" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace">ΔW = η (s⁺i · s⁺j − s⁻i · s⁻j) / 2β</text>
    <text x="16" y="242" fill="#9fb3c8" font-size="11.5">= −η · dL/dW for small β (equilibrium propagation)</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#9fb3c8" stroke-width="1.6" marker-end="url(#a)" fill="none">
    <line x1="296" y1="215" x2="316" y2="215"/>
    <line x1="582" y1="215" x2="602" y2="215"/>
    <path d="M 736 342 C 736 372, 163 372, 163 344"/>
  </g>
  <text x="450" y="378" fill="#9fb3c8" font-size="12" text-anchor="middle">next batch: the same settlement that answers is the one that learns</text>
  <text x="32" y="418" fill="#9fb3c8" font-size="12.5">No backward pass, nothing stored, nothing transposed. The goal enters through the nudge and nowhere else.</text>
</svg>
