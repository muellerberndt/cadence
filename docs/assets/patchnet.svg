<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Manrope, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a8f"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fbf9c"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f4b400"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e4572e"/></marker>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132238"/><stop offset="1" stop-color="#0d1726"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="470" rx="18" fill="url(#panel)"/>

  <!-- LEFT: feed-forward, for contrast -->
  <g transform="translate(28,24)">
    <rect x="0" y="0" width="250" height="300" rx="12" fill="#0b1421" stroke="#2c3547"/>
    <text x="16" y="28" fill="#9fb3c8" font-size="14" font-weight="700">A feed-forward network</text>
    <text x="16" y="46" fill="#6b7a8f" font-size="11.5">layers, one direction, a controller outside</text>
    <g stroke="#3a475a" stroke-width="1.2">
      <line x1="50" y1="90" x2="120" y2="80"/><line x1="50" y1="90" x2="120" y2="130"/><line x1="50" y1="90" x2="120" y2="180"/>
      <line x1="50" y1="140" x2="120" y2="80"/><line x1="50" y1="140" x2="120" y2="130"/><line x1="50" y1="140" x2="120" y2="180"/>
      <line x1="50" y1="190" x2="120" y2="80"/><line x1="50" y1="190" x2="120" y2="130"/><line x1="50" y1="190" x2="120" y2="180"/>
      <line x1="120" y1="80" x2="190" y2="110"/><line x1="120" y1="130" x2="190" y2="110"/><line x1="120" y1="180" x2="190" y2="110"/>
      <line x1="120" y1="80" x2="190" y2="160"/><line x1="120" y1="130" x2="190" y2="160"/><line x1="120" y1="180" x2="190" y2="160"/>
    </g>
    <g fill="#243141" stroke="#6b7a8f" stroke-width="1.2">
      <circle cx="50" cy="90" r="11"/><circle cx="50" cy="140" r="11"/><circle cx="50" cy="190" r="11"/>
      <circle cx="120" cy="80" r="11"/><circle cx="120" cy="130" r="11"/><circle cx="120" cy="180" r="11"/>
      <circle cx="190" cy="110" r="11"/><circle cx="190" cy="160" r="11"/>
    </g>
    <line x1="60" y1="230" x2="200" y2="230" stroke="#6b7a8f" stroke-width="1.4" marker-end="url(#grey)"/>
    <text x="130" y="246" fill="#6b7a8f" font-size="10.5" text-anchor="middle">forward pass</text>
    <path d="M 200 262 L 60 262" stroke="#e4572e" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#red)"/>
    <text x="130" y="280" fill="#e4572e" font-size="10.5" text-anchor="middle">backward pass: gradients from a controller</text>
  </g>

  <!-- RIGHT: a patch net -->
  <g transform="translate(300,24)">
    <rect x="0" y="0" width="572" height="300" rx="12" fill="#0b1421" stroke="#2c3547"/>
    <text x="16" y="28" fill="#e8ecf2" font-size="16" font-weight="700">A patch net</text>
    <text x="16" y="46" fill="#9fb3c8" font-size="11.5">owners hold patches of state; seams join them both ways; no layers, no order, no controller</text>

    <!-- seams (double-headed): drawn first, under the patches -->
    <g stroke="#3fbf9c" stroke-width="1.8" marker-start="url(#teal)" marker-end="url(#teal)" opacity="0.95">
      <line x1="120" y1="120" x2="192" y2="98"/>
      <line x1="120" y1="120" x2="186" y2="172"/>
      <line x1="120" y1="200" x2="186" y2="172"/>
      <line x1="120" y1="200" x2="176" y2="246"/>
      <line x1="192" y1="98" x2="270" y2="130"/>
      <line x1="186" y1="172" x2="270" y2="130"/>
      <line x1="186" y1="172" x2="262" y2="212"/>
      <line x1="176" y1="246" x2="262" y2="212"/>
      <line x1="270" y1="130" x2="346" y2="92"/>
      <line x1="270" y1="130" x2="352" y2="168"/>
      <line x1="262" y1="212" x2="352" y2="168"/>
      <line x1="262" y1="212" x2="336" y2="244"/>
      <line x1="346" y1="92" x2="428" y2="128"/>
      <line x1="352" y1="168" x2="428" y2="128"/>
      <line x1="352" y1="168" x2="424" y2="210"/>
      <line x1="336" y1="244" x2="424" y2="210"/>
      <line x1="192" y1="98" x2="186" y2="172"/>
      <line x1="270" y1="130" x2="262" y2="212"/>
      <line x1="346" y1="92" x2="352" y2="168"/>
      <line x1="428" y1="128" x2="424" y2="210"/>
      <line x1="428" y1="128" x2="504" y2="150"/>
      <line x1="424" y1="210" x2="504" y2="150"/>
      <line x1="424" y1="210" x2="500" y2="228"/>
    </g>
    <!-- clamps into input owners -->
    <g stroke="#9fb3c8" stroke-width="1.5" marker-end="url(#grey)">
      <line x1="60" y1="120" x2="100" y2="120"/><line x1="60" y1="200" x2="100" y2="200"/>
    </g>
    <g fill="#c9d2dd"><rect x="42" y="113" width="12" height="12"/><rect x="42" y="193" width="12" height="12"/></g>
    <text x="48" y="100" fill="#9fb3c8" font-size="11" text-anchor="middle">clamp</text>

    <!-- patches: rounded squares -->
    <g stroke="#e8ecf2" stroke-width="1.3">
      <rect x="102" y="102" width="36" height="36" rx="8" fill="#243b6e"/>
      <rect x="102" y="182" width="36" height="36" rx="8" fill="#243b6e"/>
      <rect x="174" y="80" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="168" y="154" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="158" y="228" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="252" y="112" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="244" y="194" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="328" y="74" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="334" y="150" width="36" height="36" rx="8" fill="#3fbf9c" stroke="#ffffff" stroke-width="2.2"/>
      <rect x="318" y="226" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="410" y="110" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="406" y="192" width="36" height="36" rx="8" fill="#2f4f8a"/>
      <rect x="486" y="132" width="36" height="36" rx="8" fill="#f4b400" stroke="#1c2430"/>
      <rect x="482" y="210" width="36" height="36" rx="8" fill="#f4b400" stroke="#1c2430"/>
    </g>
    <g fill="#e8ecf2" font-size="10" text-anchor="middle">
      <text x="120" y="124">v s</text><text x="120" y="204">v s</text>
      <text x="192" y="102">v s</text><text x="186" y="176">v s</text><text x="176" y="250">v s</text>
      <text x="270" y="134">v s</text><text x="262" y="216">v s</text>
      <text x="346" y="96">v s</text><text x="352" y="172" fill="#0b1421" font-weight="700">v s</text><text x="336" y="248">v s</text>
      <text x="428" y="132">v s</text><text x="424" y="214">v s</text>
      <text x="504" y="154" fill="#1c2430" font-weight="700">v s</text><text x="500" y="232" fill="#1c2430" font-weight="700">v s</text>
    </g>
    <!-- annotations -->
    <text x="120" y="282" fill="#9fb3c8" font-size="11" text-anchor="middle">input owners</text>
    <text x="500" y="282" fill="#f4b400" font-size="11" text-anchor="middle">output owners: the answer, at rest</text>
    <path d="M 352 150 C 340 110, 300 70, 250 60" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="246" y="64" fill="#ffffff" font-size="10.5" text-anchor="end">this owner reads only its five seams</text>
    <text x="246" y="78" fill="#9fb3c8" font-size="10.5" text-anchor="end">and repairs its own patch; so does every other</text>
    <text x="16" y="292" fill="#3fbf9c" font-size="11">one seam = one strength, both ways</text>
  </g>

  <!-- bottom band: the rule and the wirings -->
  <g transform="translate(28,340)">
    <rect x="0" y="0" width="844" height="106" rx="12" fill="#0b1421" stroke="#2c3547"/>
    <text x="16" y="26" fill="#e8ecf2" font-size="13" font-weight="700">One owner, every step, until nothing moves</text>
    <g fill="#c9d2dd" font-family="JetBrains Mono, Menlo, monospace" font-size="12">
      <text x="16" y="52">inbox = Σ W[e] · s[pre e]</text>
      <text x="300" y="52">v = v + dt · (inbox + clamp + bias − v)</text>
      <text x="690" y="52">s = act(v)</text>
    </g>
    <text x="16" y="76" fill="#9fb3c8" font-size="11.5">A layered wiring is one patch net among many: a connectome with 160,000 owners is another, and the same rule, reference engine, and receipts apply to both.</text>
    <text x="16" y="94" fill="#9fb3c8" font-size="11.5">Learning is this settlement run again with the outputs nudged; every seam then moves on its own two ends. No pass runs backward.</text>
  </g>
</svg>
