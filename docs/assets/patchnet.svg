<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Manrope, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb3c8"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fbf9c"/>
    </marker>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132238"/><stop offset="1" stop-color="#0d1726"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="400" rx="18" fill="url(#panel)"/>
  <text x="32" y="40" fill="#e8ecf2" font-size="20" font-weight="700">A patch net</text>
  <text x="32" y="62" fill="#9fb3c8" font-size="13">owners hold state, seams carry it both ways, and every owner repairs its own patch until the whole net is at rest</text>

  <!-- clamps -->
  <g fill="#9fb3c8" font-size="12">
    <text x="42" y="118">clamp</text>
    <rect x="40" y="130" width="14" height="14" fill="#e8ecf2"/>
    <rect x="40" y="170" width="14" height="14" fill="#7f8fa4"/>
    <rect x="40" y="210" width="14" height="14" fill="#3a475a"/>
    <rect x="40" y="250" width="14" height="14" fill="#c9d2dd"/>
    <text x="30" y="328">pixels, board cells,</text>
    <text x="30" y="344">levels in [0, 1]</text>
  </g>
  <g stroke="#9fb3c8" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="60" y1="137" x2="100" y2="137"/><line x1="60" y1="177" x2="100" y2="177"/>
    <line x1="60" y1="217" x2="100" y2="217"/><line x1="60" y1="257" x2="100" y2="257"/>
  </g>

  <!-- seams: input -> hidden (one way: inputs have no inbox) -->
  <g stroke="#3d5a80" stroke-width="1.4" opacity="0.9">
    <line x1="140" y1="137" x2="260" y2="157"/><line x1="140" y1="137" x2="260" y2="237"/>
    <line x1="140" y1="177" x2="260" y2="157"/><line x1="140" y1="177" x2="260" y2="237"/>
    <line x1="140" y1="217" x2="260" y2="157"/><line x1="140" y1="217" x2="260" y2="237"/>
    <line x1="140" y1="257" x2="260" y2="157"/><line x1="140" y1="257" x2="260" y2="237"/>
  </g>
  <!-- seams: hidden <-> output (both ways, one strength) -->
  <g stroke="#3fbf9c" stroke-width="2.2" marker-start="url(#arrowAccent)" marker-end="url(#arrowAccent)">
    <line x1="300" y1="157" x2="420" y2="177"/><line x1="300" y1="157" x2="420" y2="227"/>
    <line x1="300" y1="237" x2="420" y2="177"/><line x1="300" y1="237" x2="420" y2="227"/>
  </g>

  <!-- owners -->
  <g stroke="#e8ecf2" stroke-width="1.5">
    <circle cx="120" cy="137" r="18" fill="#243b6e"/><circle cx="120" cy="177" r="18" fill="#243b6e"/>
    <circle cx="120" cy="217" r="18" fill="#243b6e"/><circle cx="120" cy="257" r="18" fill="#243b6e"/>
    <circle cx="280" cy="157" r="20" fill="#2f4f8a"/><circle cx="280" cy="237" r="20" fill="#2f4f8a"/>
    <circle cx="440" cy="177" r="20" fill="#f4b400" stroke="#1c2430"/><circle cx="440" cy="227" r="20" fill="#f4b400" stroke="#1c2430"/>
  </g>
  <g fill="#e8ecf2" font-size="11" text-anchor="middle">
    <text x="120" y="141">v, s</text><text x="120" y="181">v, s</text><text x="120" y="221">v, s</text><text x="120" y="261">v, s</text>
    <text x="280" y="161">v, s</text><text x="280" y="241">v, s</text>
    <text x="440" y="181" fill="#1c2430" font-weight="700">v, s</text><text x="440" y="231" fill="#1c2430" font-weight="700">v, s</text>
  </g>
  <g fill="#9fb3c8" font-size="12" text-anchor="middle">
    <text x="120" y="296">input owners</text><text x="280" y="296">hidden owners</text><text x="440" y="296">output owners</text>
    <text x="440" y="312" fill="#f4b400">the answer, at rest</text>
  </g>
  <text x="330" y="126" fill="#3fbf9c" font-size="12" text-anchor="middle">one seam = one strength, both ways</text>

  <!-- the owner rule inset -->
  <rect x="520" y="100" width="348" height="230" rx="12" fill="#0b1421" stroke="#2c3547"/>
  <text x="540" y="128" fill="#e8ecf2" font-size="14" font-weight="700">One owner, every step</text>
  <g fill="#c9d2dd" font-family="JetBrains Mono, Menlo, monospace" font-size="12.5">
    <text x="540" y="158">inbox = Σ W[e] · s[pre e]</text>
    <text x="540" y="180">v = v + dt · (inbox + clamp + bias − v)</text>
    <text x="540" y="202">s = act(v)</text>
  </g>
  <text x="540" y="228" fill="#9fb3c8" font-size="12">reads only its own inbox; publishes only s</text>
  <!-- activation curve -->
  <g transform="translate(700,236)">
    <line x1="0" y1="60" x2="150" y2="60" stroke="#3a475a"/><line x1="60" y1="0" x2="60" y2="75" stroke="#3a475a"/>
    <path d="M 5 66 C 30 66, 50 62, 60 60 C 75 56, 90 32, 110 18 C 125 8, 140 5, 150 4" fill="none" stroke="#3fbf9c" stroke-width="2.4"/>
    <text x="64" y="12" fill="#9fb3c8" font-size="10">s</text><text x="140" y="72" fill="#9fb3c8" font-size="10">v</text>
    <text x="0" y="90" fill="#9fb3c8" font-size="10">rest publishes exactly 0; a small leak below</text>
  </g>

  <!-- no controller footnote -->
  <text x="32" y="372" fill="#9fb3c8" font-size="12.5">No layer order, no forward pass, no controller: the same rule, on every owner, at the same time, until nothing moves.</text>
</svg>
