name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  minimal-install:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install the wheel with only required dependencies
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install dist/*.whl
          python -m pip check
      - name: Run the documented learning and acting loops without optional backends
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          # every page whose blocks need NumPy alone: anatomy imports the benchmark
          # instruments of a source checkout and backends needs PyTorch
          for name in ("README.md", "docs/start.md", "docs/assembly.md", "docs/life.md",
                       "docs/world-model.md", "docs/teach.md", "docs/reward.md", "docs/memory.md",
                       "docs/senses.md", "docs/modules.md", "docs/space.md", "docs/speech.md",
                       "docs/grow.md", "docs/tune.md", "docs/evaluate.md", "docs/settling.md",
                       "docs/api.md"):
              page = Path(name).read_text(encoding="utf-8")
              blocks = re.findall(r"(<!-- not-run[^\n]*-->\n)?```python\n(.*?)```", page, re.S)
              code = "\n\n".join(block for marker, block in blocks if not marker)
              with tempfile.TemporaryDirectory() as directory:
                  script = Path(directory) / "documentation_example.py"
                  script.write_text(code, encoding="utf-8")
                  subprocess.run([sys.executable, str(script)], cwd=directory, check=True)
          PY
      - name: Exercise the continuing brain
        run: |
          python examples/continuing_brain.py
  previous-release:
    # brains this checkout saves without its new options load and continue, to the bit, in the
    # release before it, and a brain with a new feature is refused there by the feature's name
    runs-on: ubuntu-latest
    env:
      PREVIOUS_RELEASE: "0.103.2"
      CADENCE_FUSED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Save the panel with this checkout
        run: |
          python -m venv current
          current/bin/python -m pip install .
          current/bin/python tests/compat/previous_release.py save saved
      - name: Load it with the previous release
        run: |
          python -m venv previous
          previous/bin/python -m pip install "cadence-net==${PREVIOUS_RELEASE}"
          previous/bin/python tests/compat/previous_release.py load saved
  browser-kernel:
    # the WebAssembly kernels built from kernels/wasm and read under Pyodide in headless
    # Chromium: every kernel call of the suite's lives and launches against fused.py's own
    # Python, the map's and the records' kernels against theirs, to the bit. The built module
    # is kept as the run's artifact; a release attaches the one built on its tag's commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the module
        run: |
          python kernels/wasm/build.py
          sha256sum kernels/wasm/cadence_kernel.wasm
      - name: Install Playwright with Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Read the kernels in the browser
        run: |
          for script in shadow.py direct.py maps.py records.py pieces.py; do
            echo "::group::$script"
            python kernels/wasm/browser/run.py --timeout 900 "$script"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cadence_kernel.wasm
          path: kernels/wasm/cadence_kernel.wasm
          if-no-files-found: error
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        if: runner.os == 'Linux'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q
