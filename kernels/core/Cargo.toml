[package]
name = "cadence-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "A brain's whole moment in Rust: the state lives here between moments, the library's Python is the reference"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
libm = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
debug = false
